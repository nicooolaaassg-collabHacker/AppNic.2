<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AppNic.2</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Lienzo donde se dibuja todo el paisaje -->
  <canvas id="cielo" aria-label="Paisaje con un avión cruzando el cielo y una familia de patos en el pasto"></canvas>

  <!-- Botones en la esquina inferior derecha -->
  <div class="controles">
    <button id="semillas" class="boton" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="8" cy="9" rx="3.2" ry="5" transform="rotate(-30 8 9)" />
        <ellipse cx="16" cy="8" rx="3.2" ry="5" transform="rotate(25 16 8)" />
        <ellipse cx="12" cy="17" rx="3.2" ry="5" transform="rotate(-80 12 17)" />
      </svg>
      Semillas
    </button>
    <button id="motores" class="boton" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="none" stroke-width="2" />
        <path d="M12 12 L12 3 A9 9 0 0 1 19 7 Z M12 12 L20.5 14 A9 9 0 0 1 15 20.5 Z M12 12 L7 19.5 A9 9 0 0 1 3.2 10 Z" />
        <circle cx="12" cy="12" r="2.2" />
      </svg>
      Motores
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
